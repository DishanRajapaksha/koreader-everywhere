services:
  koreader:
    image: ghcr.io/dishanrajapaksha/koreader-everywhere:latest
    container_name: koreader-everywhere
    ports:
      - "${KOREADER_BIND:-127.0.0.1}:${KOREADER_PORT:-8080}:8080"
    environment:
      VNC_PASSWORD: "${VNC_PASSWORD:?Set VNC_PASSWORD before starting KOReader Everywhere}"
      TZ: "${TZ:-UTC}"
      EMULATE_READER_W: "${EMULATE_READER_W:-600}"
      EMULATE_READER_H: "${EMULATE_READER_H:-800}"
    volumes:
      - ./books:/books:ro
      - koreader_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  koreader_config:
