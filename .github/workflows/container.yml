name: Build container

on:
  push:
    tags:
      - '*'
  pull_request:
    paths:
      - Dockerfile
      - VERSION
      - KOREADER_VERSION
      - resources/**
      - .github/scripts/smoke-test.sh
      - .github/workflows/container.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/dishanrajapaksha/koreader-everywhere
  CACHE_SCOPE: koreader-everywhere-container

jobs:
  smoke:
    name: Boot smoke test
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read KOReader version
        id: version
        shell: bash
        run: echo "koreader=$(tr -d '[:space:]' < KOREADER_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build amd64 smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            KOREADER_VERSION=${{ steps.version.outputs.koreader }}
          tags: koreader-everywhere:smoke
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}

      - name: Boot and verify container
        env:
          KOREADER_VERSION: ${{ steps.version.outputs.koreader }}
          SMOKE_SKIP_BUILD: 'true'
        run: .github/scripts/smoke-test.sh

  release:
    name: Test and publish release
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read versions
        id: versions
        shell: bash
        run: |
          echo "project=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "koreader=$(tr -d '[:space:]' < KOREADER_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          project='${{ steps.versions.outputs.project }}'
          tag="$GITHUB_REF_NAME"

          if [ "$tag" != "$project" ] && [[ "$tag" != "$project"-* ]]; then
            echo "Tag $tag must be $project or a prerelease of it, such as $project-rc.1."
            exit 1
          fi

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'value<<EOF'
            echo "${IMAGE_NAME}:${GITHUB_REF_NAME}"
            if [ "$GITHUB_REF_NAME" = '${{ steps.versions.outputs.project }}' ]; then
              echo "${IMAGE_NAME}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build amd64 smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            KOREADER_VERSION=${{ steps.versions.outputs.koreader }}
          tags: koreader-everywhere:smoke
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}

      - name: Boot and verify container
        env:
          KOREADER_VERSION: ${{ steps.versions.outputs.koreader }}
          SMOKE_SKIP_BUILD: 'true'
        run: .github/scripts/smoke-test.sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            KOREADER_VERSION=${{ steps.versions.outputs.koreader }}
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}
          sbom: true
          provenance: mode=max
