name: Build container

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - Dockerfile
      - VERSION
      - KOREADER_VERSION
      - resources/**
      - .github/scripts/smoke-test.sh
      - .github/workflows/container.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/dishanrajapaksha/koreader-everywhere

jobs:
  smoke:
    name: Boot smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read versions
        id: versions
        shell: bash
        run: |
          echo "project=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "koreader=$(tr -d '[:space:]' < KOREADER_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected="v${{ steps.versions.outputs.project }}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($expected)."
            exit 1
          fi

      - name: Build and boot container
        env:
          KOREADER_VERSION: ${{ steps.versions.outputs.koreader }}
        run: .github/scripts/smoke-test.sh

  publish:
    name: Publish multi-architecture image
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read versions
        id: versions
        shell: bash
        run: |
          echo "project=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "koreader=$(tr -d '[:space:]' < KOREADER_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            KOREADER_VERSION=${{ steps.versions.outputs.koreader }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.versions.outputs.project }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
